<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PULSO - Traslado</title>
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/png" href="recursos/logo-pulsoA.png">
  </head>
  <body>
    <header class="barra-superior">
      <a class="marca" href="panel.html">
        <img src="recursos/logo-pulsoA.png" alt="">
        <span>PULSO</span>
      </a>
      <nav class="navegacion" aria-label="Páginas principales">
        <a href="panel.html">Panel</a>
        <a href="pacientes.php">Pacientes</a>
        <a href="documentos.html">Documentos</a>
        <a class="enlace-activo" href="ambulancia.html">Ambulancias</a>
        <a href="index.html">Inicio</a>
      </nav>
    </header>

    <main class="pagina">
      <section class="encabezado-pagina">
        <div>
          <p class="subtitulo">Gestión de traslados</p>
          <h1>Nuevo traslado</h1>
          <p>Complete los datos disponibles para programar el traslado.</p>
        </div>
      </section>

      <section class="tarjeta">
        <form class="formulario formulario-dos-columnas" action="traslado.html" method="post">
          <label for="paciente">
            Paciente
            <select id="paciente" name="id_paciente">
              <option value="">Sin paciente asociado</option>
            </select>
          </label>

          <label for="ambulancia">
            Ambulancia
            <select id="ambulancia" name="matricula" required>
              <option value="" disabled selected>Seleccionar</option>
              <option value="AMB-001">AMB-001</option>
            </select>
          </label>

          <label for="creador">
            Funcionario que registra
            <select id="creador" name="id_creador" required>
              <option value="" disabled selected>Seleccionar</option>
            </select>
          </label>

          <label for="conductor">
            Conductor
            <select id="conductor" name="id_conductor" required>
              <option value="" disabled selected>Seleccionar</option>
            </select>
          </label>

          <label for="acompanante">
            Acompañante
            <select id="acompanante" name="id_acompanante">
              <option value="">Sin acompañante</option>
            </select>
          </label>

          <label for="tipo-carga">
            Tipo de carga
            <select id="tipo-carga" name="id_tipo_carga" required>
              <option value="" disabled selected>Seleccionar</option>
              <option value="1">Paciente</option>
              <option value="2">Insumo médico</option>
              <option value="3">Equipamiento</option>
            </select>
          </label>

          <label for="prioridad">
            Prioridad
            <select id="prioridad" name="id_tipo_prioridad" required>
              <option value="" disabled selected>Seleccionar</option>
              <option value="1">Baja</option>
              <option value="2">Media</option>
              <option value="3">Alta</option>
              <option value="4">Urgente</option>
            </select>
          </label>

          <label for="salida-prevista">
            Salida prevista
            <input id="salida-prevista" type="datetime-local" name="salida_prevista" required>
          </label>

          <label class="campo-completo" for="origen">
            Origen
            <input id="origen" type="text" name="origen" required>
          </label>

          <label class="campo-completo" for="destino">
            Destino
            <input id="destino" type="text" name="destino" required>
          </label>

          <label class="campo-completo" for="descripcion-carga">
            Descripción de la carga
            <textarea id="descripcion-carga" name="descripcion_carga" maxlength="255"></textarea>
          </label>

          <label for="estado-inicial">
            Estado inicial
            <input id="estado-inicial" type="text" value="Programado" readonly>
          </label>

          <div class="acciones campo-completo">
            <a class="boton boton-secundario" href="ambulancia.html">Cancelar</a>
            <button class="boton" type="submit">Registrar traslado</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
