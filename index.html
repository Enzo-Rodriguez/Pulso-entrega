<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PULSO - Ingreso</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="icon" type="image/png" href="recursos/logo-pulsoA.png">
</head>

<body>
  <main class="pantalla-ingreso">
    <section class="presentacion-ingreso">
      <img src="recursos/logo-pulsoA.png" alt="Logo de PULSO">
      <p class="subtitulo">Proyecto académico</p>
      <h1>PULSO</h1>
      <p>Sistema para organizar pacientes, documentos, equipamiento, funcionarios y traslados.</p>
    </section>

    <section class="formulario-ingreso">
      <a class="marca" href="index.html">
        <img src="recursos/logo-pulsoA.png" alt="">
        <span>PULSO</span>
      </a>
      <p class="subtitulo">Acceso interno</p>
      <h2>Ingreso al sistema</h2>
      <p>Acceso para funcionarios autorizados.</p>

      <form id="formulario-ingreso" class="formulario" method="POST">

        <label for="ci">
          Cédula de Identidad
          <input id="ci" name="ci" type="text" autocomplete="username" required>
        </label>

        <label for="contrasenia">
          Contraseña
          <input id="contrasenia" name="contrasenia" type="password" autocomplete="current-password" required>
        </label>

        <button type="submit" class="boton">Entrar al sistema</button>

      </form>

    </section>
  </main>
  <script src="inicio.js"></script>
</body>

</html>
